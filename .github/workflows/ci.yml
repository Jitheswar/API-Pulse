name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linting
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing -v

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r app/ -ll -ii

      - name: Check dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit

  docker:
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-pulse:test .

      - name: Test Docker image starts
        run: |
          docker run -d --name test-container -p 5000:5000 api-pulse:test
          sleep 5
          curl -f http://localhost:5000/health || exit 1
          docker stop test-container
