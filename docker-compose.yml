services:
  app:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://pulse:pulse@db:5432/api_pulse
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-dev-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: api_pulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
